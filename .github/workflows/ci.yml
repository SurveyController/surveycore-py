name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: amd64
            runner: ubuntu-24.04
            python-version: "3.13.15"
          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.13.15"
          - os: macOS
            arch: amd64
            runner: macos-13
            python-version: "3.13.15"
          - os: macOS
            arch: arm64
            runner: macos-14
            python-version: "3.13.15"
          - os: Windows
            arch: amd64
            runner: windows-2022
            python-version: "3.13.15"
          - os: Windows
            arch: arm64
            runner: windows-11-arm
            python-version: "3.13.15"
          # Keep the minimum supported interpreter in the CI gate.
          - os: Linux
            arch: amd64
            runner: ubuntu-24.04
            python-version: "3.11"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  quality:
    name: Lint, type check, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting and lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Build package
        run: uv build
