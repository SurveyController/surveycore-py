[project]
name = "surveycore-py"
version = "0.1.0"
description = "Async HTTP survey parsing and submission toolkit"
authors = [
    { name = "HUNGRY_M0", email = "mail@hungrym0.com" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["survey", "questionnaire", "async", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27,<1",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/SurveyController/surveycore-py"
Repository = "https://github.com/SurveyController/surveycore-py"
Issues = "https://github.com/SurveyController/surveycore-py/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "ruff>=0.15",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "surveycore"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I"]
ignore = ["ASYNC109", "ASYNC110"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["src/surveycore"]

[tool.coverage.report]
fail_under = 80
show_missing = true
